# The CLI for each platform it is published for, on a runner of that
# platform; Linux's linked statically, so it runs on any distribution. A
# pull request that raises the CLI's version runs it, and so does its merge;
# anyone may by hand, to see every platform build.
name: CLI

on:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - { platform: darwin-arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { platform: darwin-x64, target: x86_64-apple-darwin, runner: macos-latest }
          - { platform: linux-x64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { platform: linux-arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p enclavid-cli --target ${{ matrix.target }}
      # The build says the version of the package it goes into.
      - if: matrix.platform != 'darwin-x64'
        run: test "$(target/${{ matrix.target }}/release/enclavid --version)" = "enclavid $(jq -r .version crates/cli/package.json)"
      - uses: actions/upload-artifact@v7
        with:
          name: enclavid-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/enclavid
          if-no-files-found: error
