[package]
name = "face-age"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Build the artifact whose model the host runs: the `with-models` world, which
# imports this plugin's slot, `enclavid-ext:face-age/models`, whose `age` is
# MiVOLO. The model is not in the component: its graph and data file are
# pushed beside it as the layers `age.onnx` and `age.onnx.data`. Profile: 384²
# letterboxed RGB, ImageNet-normalized, the face beside an empty body.
# Default (off) = placeholder (an age from the crop's brightness, no model).
mivolo = []

[dependencies]
wit-bindgen = "0.57"
