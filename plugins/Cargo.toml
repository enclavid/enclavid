# The plugins' workspace — a SEPARATE build unit from the host `crates/*`
# workspace: every crate here is a plugin, built for wasm32-unknown-unknown
# (`.cargo/config.toml`) into a sandboxed component.
[workspace]
resolver = "2"
members = ["well-known", "vision", "face-detect", "face-age"]

[profile.release]
opt-level = "s"
lto = true
strip = true
