[package]
name = "face-detect"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Build the artifact whose detector the host runs: the `with-models` world,
# which imports this plugin's slot, `enclavid-ext:face-detect/models`, whose
# `detector` is MediaPipe's BlazeFace (short range) with its anchor decoding,
# sigmoid and NMS in the graph. The model is not in the component: its graph is
# pushed beside it as the layer `detector.onnx`. Profile: the frame kept whole
# on a black square of 128², RGB in `[-1, 1]`. Default (off) = placeholder
# (whole frame, no model).
blazeface = []

[dependencies]
wit-bindgen = "0.57"
