[package]
name = "enclavid-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The trusted storage-CVM: an attested, RA-TLS-fronted embedded KV that replaces
# the untrusted host's Redis (session state) + object_store cache (L2 cwasm). It
# is a BLIND ciphertext store — every payload arrives already AEAD-sealed under
# `tee_seal_key` (TEE-side, in hatch-client), so the CVM never holds a key or
# plaintext PII. Serves both `storage-rpc` services over one RA-TLS/remoc
# connection; api is the sole client. The lib exposes the store cores so they are
# unit-testable without remoc.

[[bin]]
name = "storage-cvm"
path = "src/bin/storage-cvm.rs"

[lib]
name = "enclavid_storage"
path = "src/lib.rs"

[dependencies]
# The guest's one channel to the host: `info!`/`warn!`/`error!` carry a written
# reason and reach the port; `debug!` needs none and is not built in production.
safe-logger = { path = "../safe-logger", features = ["device"] }
storage-rpc = { path = "../storage-rpc" }
hatch-protocol = { path = "../hatch-protocol" }
# The RA-TLS backend is chosen here, not by ra-tls — see the `[features]` axis.
# The hardware arm exists now: a blind CVM still cannot reach AMD for the
# certificate that would endorse it, so it mints without one and api, which can
# reach AMD, verifies against its own copy of the same chip's.
enclavid-ra-tls = { path = "../ra-tls" }
fleet-transport = { path = "../fleet-transport" }
enclavid-attestation = { path = "../attestation", default-features = false }

# Per-session store: one embedded SQLite database file per session (bundled so
# the amalgamation is built into the measured image, no system libsqlite). ACID
# CAS in one transaction; opens in ~tens of µs, so a fresh connection per op is
# cheap. Page-chain blobs (no contiguity requirement) suit the ≤64 MiB media.
rusqlite = { version = "0.32", features = ["bundled"] }
# Two hashes, both SHA-256. The record name a call may reach is derived from the
# calling peer's launch digest (see `crate::scope`), and the file that name lands
# in is hex(sha256(name)) — identity-hiding, and a path-traversal guard (see
# `crate::session`).
sha2 = "0.10"
# L2 cwasm cache backend — a backend-agnostic `ObjectStore` blob interface
# (local filesystem today), separate from the session store. The cache is
# per-instance: each blob is sealed under the writer's chip-bound `tee_seal_key`
# (see `crate::cache`), so it is never fleet-shared.
object_store = "0.12"

remoc = { version = "0.18", default-features = false, features = [
    "rtc",
    "codec-ciborium",
] }
tokio = { version = "1", features = ["full"] }
# RA-TLS acceptor (ring provider, like the execution-worker).
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
# Path-traversal guard on cache keys (hex-only), mirroring the hatch.
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[features]
# The attestation backend, and it is a choice rather than an addition. Cargo
# features are additive, so `sev-snp` on top of the default would leave the
# software identity compiled in beside the real one — and that identity is a
# seed literal in this repository, which anyone can hold. The attested build
# therefore turns the default OFF:
#   cargo build -p enclavid-storage --no-default-features --features sev-snp,vsock
default = ["dev-attestation"]
# The ONE shared identity a dev fleet needs: a software attestor verifies
# against its own key, so peers that each generated their own could never
# attest each other.
dev-attestation = ["enclavid-attestation/mock"]
# Real hardware attestation. Mints through `/dev/sev-guest` and carries NO
# endorsement, because this guest has no egress to fetch one — api supplies it
# from its own copy of the same chip's. See `SnpAttestor::mint_only`.
sev-snp = ["enclavid-attestation/sev-snp"]
# The attested build: reach api over vsock instead of TCP. A measured guest
# kernel has no IP stack, so this is not a preference.
vsock = ["fleet-transport/vsock"]
# Compiles the `debug!` sites in. OFF in the measured build, so a production
# binary holds no diagnostic that nobody wrote a reason for.
debug = ["safe-logger/debug"]
