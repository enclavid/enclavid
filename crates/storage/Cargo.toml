[package]
name = "enclavid-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The trusted storage-CVM: an attested, RA-TLS-fronted embedded KV that replaces
# the untrusted host's Redis (session state) + object_store cache (L2 cwasm). It
# is a BLIND ciphertext store — every payload arrives already AEAD-sealed under
# `tee_seal_key` (TEE-side, in hatch-client), so the CVM never holds a key or
# plaintext PII. Serves both `storage-rpc` services over one RA-TLS/remoc
# connection; api is the sole client. The lib exposes the store cores so they are
# unit-testable without remoc.

[[bin]]
name = "storage-cvm"
path = "src/bin/storage-cvm.rs"

[lib]
name = "enclavid_storage"
path = "src/lib.rs"

[dependencies]
storage-rpc = { path = "../storage-rpc" }
hatch-protocol = { path = "../hatch-protocol" }
# The RA-TLS backend is chosen here, not by ra-tls: this build attests with a
# software identity the whole dev fleet shares. There is no hardware arm yet —
# a blind CVM has no way to reach AMD for the certificate that would endorse it.
enclavid-ra-tls = { path = "../ra-tls" }
enclavid-attestation = { path = "../attestation", default-features = false, features = ["mock"] }

# Per-session store: one embedded SQLite database file per session (bundled so
# the amalgamation is built into the measured image, no system libsqlite). ACID
# CAS in one transaction; opens in ~tens of µs, so a fresh connection per op is
# cheap. Page-chain blobs (no contiguity requirement) suit the ≤64 MiB media.
rusqlite = { version = "0.32", features = ["bundled"] }
# Identity-hiding session filename = hex(sha256(session_id)) — also a path-
# traversal guard (see `crate::session`).
sha2 = "0.10"
# L2 cwasm cache backend — a backend-agnostic `ObjectStore` blob interface
# (local filesystem today), separate from the session store. The cache is
# per-instance: each blob is sealed under the writer's chip-bound `tee_seal_key`
# (see `crate::cache`), so it is never fleet-shared.
object_store = "0.12"

remoc = { version = "0.18", default-features = false, features = [
    "rtc",
    "codec-ciborium",
] }
tokio = { version = "1", features = ["full"] }
# RA-TLS acceptor (ring provider, like the execution-worker).
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
# Path-traversal guard on cache keys (hex-only), mirroring the hatch.
hex = "0.4"

[dev-dependencies]
tempfile = "3"
