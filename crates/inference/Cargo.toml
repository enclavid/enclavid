[package]
name = "enclavid-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Vendor-style models built in code — a graph and its data file — for the tests
# of the crates that check and run them; never a build that ships.
test-models = []

[dependencies]
# Elements sent as the bytes they lie in, and bytes read back as elements: a
# tensor crosses whole.
zerocopy = "0.8"
# The messages are serde values, which `coprocess-channel` carries; a tensor's
# elements go as a byte string.
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
# A vendor's graph read for its check: the derive over the part of ONNX's
# schema the check needs, nothing generated at build time.
prost = "0.14"
thiserror = "1"

[dev-dependencies]
coprocess-channel = { path = "../coprocess-channel" }
