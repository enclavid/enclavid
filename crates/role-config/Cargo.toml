# Where a role binary reads its configuration from. No dependencies: it is a
# lookup in one of two places, and which place is a build-time fact.
[dependencies]

[features]
# The attested build. A guest has no environment — PID 1 runs the role binary
# directly and sets nothing — so configuration arrives on the kernel command
# line, which is measured.
guest = []
