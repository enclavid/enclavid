[package]
name = "engine-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Leaf domain types shared by the compile + execute halves of the engine
# fleet. NO wasmtime, NO cranelift — that wasmtime-freedom is the whole
# point: `engine-rpc` contract and the client-only `api`
# orchestrator can depend on these types without pulling the runtime.
[dependencies]
serde = { version = "1", features = ["derive"] }
# Encode the plugin `wasm` bytes as a CBOR byte string, not a per-byte integer
# array (ciborium's default for `Vec<u8>`) — see the `wasm` field.
serde_bytes = "0.11"
# Unicode General_Category lookup for the consent / i18n text WHITELIST in
# `sanitize`: only visible-content categories pass (default-deny), closing the
# invisible-character covert channel robustly instead of via an ever-incomplete
# blacklist. Small table-driven crate; leaf-safe (no wasmtime).
unicode-general-category = "1"
# Owns the wire-format cardinality caps re-exported by `limits`, the text
# model, and the reader the registry reads a catalog with; a leaf (no
# wasmtime) so it does not compromise this crate's leaf-ness.
enclavid-embedded = { path = "../embedded" }

[dev-dependencies]
# The codec the compile hop decodes a refusal with, for the test that it holds a
# name to the same rule.
ciborium = "0.2"
# The registry's tests write the i18n sections they read.
serde_json = "1"
