[package]
name = "host-hatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "host-hatch"
path = "src/main.rs"

[features]
# Default: TCP listener (dev / CI). Enable `vsock` for the attested
# production deployment — the hatch binds a vsock CID/port the guest
# CVM dials. Mutually exclusive at the binary level.
default = []
vsock = ["dep:tokio-vsock"]

[dependencies]
hatch-protocol = { path = "../hatch-protocol" }

# HTTP server
axum = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Outbound: OCI registry pulls + OIDC JWKS fetch (host-side network)
oci-client = "0.16"
# A blob's stream, passed on to the TEE as it comes from the registry.
futures = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
jsonwebtoken = "9"
url = "2"

# Per-principal rate limits on the client API
governor = { version = "0.10", default-features = false, features = ["std"] }

# Digest verification convenience on OCI pulls
sha2 = "0.10"
hex = "0.4"

# Errors + logging + (de)serialization
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Ages a held key set without waiting out the minutes.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { version = "0.7", optional = true }
