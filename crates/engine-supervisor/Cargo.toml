[package]
name = "engine-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Process-isolation plumbing shared by the engine fleet's WORKERS (execution +
# compile). A worker SUPERVISOR spawns a fresh disposable CHILD PROCESS per
# request, drives ONE typed remoc RPC in it under a concurrency bound + a
# wall-clock deadline, and reaps it — so untrusted work (running wasm, or
# Cranelift-compiling untrusted wasm) is confined to a throwaway per-request
# process behind an OS address-space boundary. This crate owns the FIDDLY,
# security-load-bearing bits (socketpair fd hygiene, the deadline that stops a
# WEDGED child leaking its slot, kill+reap) so they are written + tested ONCE and
# both workers ride them. A DOMAIN-AGNOSTIC leaf: it depends ONLY on tokio +
# remoc, NOT on engine-rpc / engine-types, so the orchestrator (api) never links
# it. The future fork-zygote (warm CoW start) lands HERE → both workers benefit.
[dependencies]
# The CHILD half needs only these three: a runtime, the socketpair it adopts on
# fd 0, and the framing remoc reads it with. `process`/`sync`/`time` are the
# parent's and arrive with that feature — see `parent` below for why the split
# is worth a feature.
tokio = { version = "1", features = ["rt", "net", "io-util"] }
remoc = { version = "0.18", default-features = false, features = [
    "rtc",
    "codec-ciborium",
] }
# For the pre_exec fd handoff: dup2/fcntl to install a caller's fd at a
# deterministic child fd number with CLOEXEC cleared (the memfd cwasm delivery).
# Raw libc (not nix) because a pre_exec closure must be async-signal-safe — no
# allocation, no panics — which the thin syscall wrappers here satisfy.
libc = { version = "0.2", optional = true }

# Build the child's egress seccomp BPF (deny socket-family syscalls) in the
# PARENT; the filter is installed post-fork via a raw seccomp(2) syscall over the
# pre-built program (async-signal-safe). Pure Rust — no libseccomp C dep. Linux-
# only: the disposable-child workers run only under the SEV-SNP CVM.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { version = "0.4", optional = true }
# The boot-time ptrace floor reports both outcomes. On a guest stderr is
# /dev/null and a panic payload never leaves, so a load-bearing check that used
# either would announce nothing to the operator who has to act on it.
safe-logger = { path = "../safe-logger", optional = true }

[features]
default = ["parent"]

# The PARENT half: spawn, harden, bound, kill, reap. Default-on, because a
# consumer that says nothing wants a supervisor; the two child packages turn it
# OFF explicitly, which is where the restriction reads.
#
# It is a feature and not merely a module because of ONE dependency:
# `tokio/process`. The parent needs `tokio::process::Command`; enabling that
# feature makes tokio's runtime start a signal driver, and the signal driver is
# why a disposable child — which spawns nothing — calls `socketpair` at startup.
# That call had to be taken back out of the egress seccomp denylist to keep
# children alive. Off here, the cause goes away rather than the symptom.
#
# `dep:` on a target-gated optional dependency is inert on the non-matching
# platform, so naming seccompiler/safe-logger here is correct off Linux too.
parent = [
    "dep:libc",
    "dep:seccompiler",
    # `assert_ptrace_hardened` reports both outcomes on the channel, so the
    # parent half needs the outward tier. The child half of this crate says
    # nothing at all.
    "dep:safe-logger",
    "safe-logger/device",
    "tokio/process",
    "tokio/sync",
    "tokio/time",
]

# Whether this build ENFORCES the ptrace floor — see `assert_ptrace_hardened`.
# Off by default because the floor is `scope=3`, which a machine cannot undo
# without rebooting; a measured guest image builds with it on. Same shape as the
# attestation backend axis: a compile-time choice, never a runtime bypass.
# Implies `parent`: the floor is asserted by a supervisor at boot, before any
# child exists, so there is nothing for a child build to enforce.
guest-hardening = ["parent"]
