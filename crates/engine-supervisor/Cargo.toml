[package]
name = "engine-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Process-isolation plumbing shared by the engine fleet's WORKERS (execution +
# compile). A worker SUPERVISOR spawns a fresh disposable CHILD PROCESS per
# request, drives ONE typed remoc RPC in it under a concurrency bound + a
# wall-clock deadline, and releases it — so untrusted work (running wasm, or
# Cranelift-compiling untrusted wasm) is confined to a throwaway per-request
# process behind an OS address-space boundary. This crate owns the FIDDLY,
# security-load-bearing bits (socketpair fd hygiene, the deadline that stops a
# WEDGED child leaking its slot, kill+release) so they are written + tested ONCE and
# both workers ride them. A DOMAIN-AGNOSTIC leaf: never engine-rpc or
# engine-types, so the orchestrator (api) never links it.
[dependencies]
# The CHILD half needs only these three: a runtime, the socketpair it adopts on
# fd 0, and the framing remoc reads it with. `process`/`sync`/`time` are the
# parent's and arrive with that feature — see `parent` below for why the split
# is worth a feature.
tokio = { version = "1", features = ["rt", "net", "io-util"] }
remoc = { version = "0.18", default-features = false, features = [
    "rtc",
    "codec-ciborium",
] }
# The error types of both halves. A derive, so nothing of it reaches the binary.
thiserror = "1"
# The system calls the parent makes, in safe wrappers: the boot checks (the
# descriptor limit, what is mounted, the guest's memory, an inherited file's
# length) and everything a child is given between fork and exec — its memory
# group, score, limits and identity. rustix makes each one a direct system call
# that allocates nothing for a `&CStr` path, which is what a post-fork closure
# needs, and its `thread` calls change the calling thread alone, which a forked
# child's single thread is. Already in every worker image, through wasmtime.
rustix = { version = "1.1", optional = true, default-features = false, features = [
    "std",
    "fs",
    "mount",
    "process",
    "system",
    "thread",
] }
# What rustix does not cover: putting a caller's fd on a fixed child fd number
# (`dup2` to a number nothing in the child owns yet), and the constants the
# boot checks compare against. Also the developer's non-Linux arm of the memory
# reading.
libc = { version = "0.2", optional = true }
# The boot-time floors report both outcomes. On a guest stderr is /dev/null and a
# panic payload never leaves, so a load-bearing check that used either would
# announce nothing to the operator who has to act on it. NOT target-gated: the
# ptrace floor is Linux-only, but the descriptor floor is enforced in every build
# — a developer's machine is where an undersized RLIMIT_NOFILE turns up first.
safe-logger = { path = "../safe-logger", optional = true }

# Builds the child's syscall filters in the PARENT; they are installed post-fork
# by `apply_filter` over the pre-built programs — `no_new_privs` and seccomp(2),
# nothing allocated. Pure Rust — no libseccomp C dep. Linux-only: the
# disposable-child workers run only under the SEV-SNP CVM.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { version = "0.4", optional = true }

[features]
default = ["parent"]

# The PARENT half: spawn, harden, bound, kill, release. Default-on, because a
# consumer that says nothing wants a supervisor; the two child packages turn it
# OFF explicitly, which is where the restriction reads.
#
# It is a feature and not merely a module because of ONE dependency:
# `tokio/process`. The parent needs `tokio::process::Command`; enabling that
# feature makes tokio's runtime start a signal driver, which calls `socketpair`
# at startup — a call the child's syscall allowlist does not have. A child
# built without the feature starts no such driver.
#
# `dep:` on a target-gated optional dependency is inert on the non-matching
# platform, so naming seccompiler here is correct off Linux too. safe-logger is
# NOT target-gated — the descriptor floor reports on every platform.
parent = [
    "dep:libc",
    "dep:rustix",
    "dep:seccompiler",
    # `require_ptrace_scope` reports both outcomes on the channel, so the
    # parent half needs the outward tier. The child half of this crate says
    # nothing at all.
    "dep:safe-logger",
    "safe-logger/device",
    "tokio/process",
    "tokio/sync",
    "tokio/time",
]

# Whether this build ENFORCES the ptrace floor — see `require_ptrace_scope` —
# and holds its children's memory with the kernel's — see `Cgroups::create`.
# Off by default because the floor is `scope=3`, which a machine cannot undo
# without rebooting, and the memory tree needs a cgroup v2 root this process may
# build under; a measured guest image builds with it on. Same shape as the
# attestation backend axis: a compile-time choice, never a runtime bypass.
# Implies `parent`: both are set up by a supervisor at boot, before any child
# exists, so there is nothing for a child build to enforce.
guest-hardening = ["parent"]

# A build with the `debug!` tier: a disposable child is given its supervisor's
# stderr, so the child's own `debug!` reaches the port the rest of a `-debug`
# image writes to, instead of `/dev/null`. Compiled out of every other build —
# there a child's stdio stays null. Asked for by a worker's own `debug`; implies
# `parent`, since only a supervisor spawns.
debug = ["parent", "safe-logger/debug"]

[dev-dependencies]
# Paused time: the admission tests assert a wait to its end without sitting it out.
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "test-util"] }
# Mapping an inherited cwasm the way the executor child does, in the identity
# test.
rustix = { version = "1.1", default-features = false, features = ["mm"] }
