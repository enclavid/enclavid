[package]
name = "enclavid-ra-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Intra-fleet mutual RA-TLS (orchestrator <-> compile/execution workers). Each side
# mints an EPHEMERAL self-signed TLS cert whose SubjectPublicKeyInfo is bound into an
# attestation quote carried in a custom X.509 extension; the rustls handshake verifies
# the peer's quote DURING the handshake (custom verifier), so a valid TLS session
# proves the peer runs the pinned measurement and owns the TLS key — no CA, no KMS.
#
# The attestation backend is NOT selected here. This crate takes an `Arc<dyn Attestor>`
# per config, so it names no backend and enables no feature on `enclavid-attestation` —
# which is what stops an edge on this crate from arming a software signer inside a binary
# built for hardware attestation.
[dependencies]
enclavid-attestation = { path = "../attestation", default-features = false }

# Pin the ring crypto provider (lighter than aws-lc, builds anywhere) on both rustls
# and tokio-rustls so we never drag aws-lc-sys into the TEE binary.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"

# Mint the ephemeral self-signed cert + embed the quote in a custom extension.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Parse the peer's leaf cert on verify: pull our extension + the SPKI DER.
x509-parser = "0.16"

# CBOR-encode the `Quote` into the cert extension (project is CBOR-native).
ciborium = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
# The tests need SOME backend to exercise the handshake; the software one is the only
# kind that runs without hardware. A dev-dependency, so it reaches the tests and nothing
# that links this crate.
enclavid-attestation = { path = "../attestation", features = ["mock"] }
