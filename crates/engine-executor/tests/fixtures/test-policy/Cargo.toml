[workspace]

[package]
name = "test-policy"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"
# The WASI the probe reads (`probe_state`), with its own WIT: WASI is not this
# policy's world, so it carries no copy of it.
wasip2 = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
