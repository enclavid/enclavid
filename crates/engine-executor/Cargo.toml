[package]
name = "engine-executor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The EXECUTE half of the engine fleet: deserialize a compiled `cwasm`,
# instantiate it, and drive ONE pure-reducer round through the bindgen host
# world (embedded resolvers, media blobs) and the policy's own props. This crate
# runs the UNTRUSTED policy wasm and carries NO Cranelift — its wasmtime is
# RUNTIME-only, so the execution-worker CVM has zero compiler surface. It
# shares only the plain-data engine-types leaf with engine-compiler; a
# serialized `cwasm` (produced there) is the sole input crossing in.
[dependencies]
# The guest's one channel to the host. This role withholds the panic LOCATION
# outside a debug build (`install_panic(cfg!(feature = "debug"))`): it runs the
# consumer's wasm, so a panic site reached is a site that code could have chosen.
#
# WITHOUT the `device` feature here — the worker adds it below. The library uses
# none of this crate; only the worker bin does. Leaving it off means the child
# package, which depends on this library and is built by its own cargo
# invocation, gets no outward half through this edge either.
safe-logger = { path = "../safe-logger" }
engine-types = { path = "../engine-types" }
session-types = { path = "../session-types" }

# RUNTIME only — NO `cranelift`. `Component::deserialize` + instantiate +
# run need the runtime; codegen (`Component::new`) lives in engine-compiler.
# Same non-cranelift feature set otherwise so the `Config` (engine_config)
# matches the compiler's and a compiler-produced cwasm loads here.
wasmtime = { version = "46", default-features = false, features = [
    "component-model",
    "runtime",
    "std",
    "async",
    # WAVE, the component model's own value encoding: a session's props are
    # read against the type the component declares and written in it, and
    # every round reads them back from it. An API, not a codegen setting, so
    # the `Config` the cwasm header records is the compiler's still.
    "wave",
] }

# Content-addresses each captured frame (`convert::event_to_wit`) so the
# blob store keys blobs by BLAKE3 hash.
blake3 = "1"
# The consumer's props arrive as the JSON value it gave the session, read
# against the type the policy declares (`props::read`).
serde_json = "1"
# The semver track an import name is looked up on — the linker's own rule,
# which `props::declared` finds the props' interface by. wasmtime's own
# dependency, at its version; no codegen.
wasmtime-environ = { version = "46", default-features = false, features = ["component-model"] }
# WASI 0.2 for what toolchains' runtimes import and a round has no use for: an
# empty environment, stdio that reads nothing and writes nowhere, a filesystem
# with nothing opened (`round`). Only `p2`: no preview 1, no async preview 3.
# Its clocks are never linked (they read real time) and neither are sockets.
wasmtime-wasi = { version = "46", default-features = false, features = ["p2"] }
# `wasi:io`'s own bindings and its `Pollable`, which the round's deadlines are.
wasmtime-wasi-io = { version = "46", default-features = false, features = ["std"] }
# Named by the library only for the `AsyncWrite` in the stdio trait it
# implements (`round`), so with no features: wasmtime-wasi pulls tokio in
# anyway, and what the worker runs on it, it asks for itself (`worker`).
tokio = { version = "1", default-features = false }

# --- execution-worker bin deps (optional) — pulled ONLY by the `worker`
# feature, so the LIB stays rpc/remoc-free. The worker BIN is the deployable
# execution-worker CVM: it serves `engine_rpc::RemoteExecutor`, caches each
# composition's cwasm, and drives one disposable child per round — this crate's
# `Executor` runs in that CHILD (engine-executor-child), not here. It also proxies
# the child's mid-run callbacks (media_load / session_change) on to the
# orchestrator over the SAME remoc connection — KEYLESS (no tee_seal_key ever
# crosses in). ---
engine-rpc = { path = "../engine-rpc", default-features = false, features = ["execute"], optional = true }
# The concern vocabulary. The supervisor names its own scope on what api sends it
# — it accepts any attested guest, so it has something open to say — and reaches
# the words directly rather than through whoever happens to re-export them.
enclavid-boundary = { path = "../boundary", optional = true }
# `boundary!`: the supervisor's end of the api leg, declared. Build-time only.
enclavid-boundary-macros = { path = "../boundary-macros", optional = true }
# Shared disposable-child process-isolation plumbing (spawn + concurrency bound +
# round deadline + release); the compile-worker rides the same crate.
engine-supervisor = { path = "../engine-supervisor", optional = true }
remoc = { version = "0.18", default-features = false, features = [
    "rtc",
    "codec-ciborium",
], optional = true }
# The L1's map: eviction order, a weigher, a hook that keeps an entry a round is
# using, and one fill per composition however many rounds miss on it at once.
# No default features: std locks and std's hasher, nothing beyond `hashbrown`.
quick_cache = { version = "0.7", default-features = false, optional = true }

# Mutual RA-TLS on the api->worker hop: the worker's listener wraps each accepted
# TCP stream in an attested TLS server. Dev-bypass = the mock attestation backend
# (default); the prod flip is this crate's own `sev-snp`, off the defaults.
# `enclavid-ra-tls` names no backend and has no features to flip.
enclavid-ra-tls = { path = "../ra-tls", optional = true }
fleet-transport = { path = "../fleet-transport", optional = true }
# The guard on the guest's clock (`timesync::guard`), in the attested build: a
# round's time is this clock. Optional, and only through `vsock`, because the
# child links this crate's library and must not take an outward channel with it.
timesync = { path = "../timesync", optional = true }
# The RA-TLS backend is chosen here, not by ra-tls — see the `[features]` axis.
# The hardware arm exists now. This worker still has no path to AMD, which is
# what shapes it rather than what prevents it: it mints without an endorsement
# and api, which can reach AMD, verifies against its own copy of the same chip's.
enclavid-attestation = { path = "../attestation", default-features = false, optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }

# The supervisor materializes each composition's `cwasm` as an anonymous in-RAM
# file the child MMAPs by fd. On the Linux CVM that is a sealed `memfd` (RAM-backed,
# no filesystem name, write-sealed); `memfd` is already in our tree via wasmtime, so
# this direct dep adds nothing to the binary. `worker`-gated.
[target.'cfg(target_os = "linux")'.dependencies]
memfd = { version = "0.6", optional = true }
# `mm` for the read-only mapping the admission check reads a sealed cwasm through,
# in place. Already in our tree via wasmtime and memfd, so it adds nothing either.
rustix = { version = "1", default-features = false, features = ["mm"], optional = true }

# Dev/test (macOS) fallback: an unlinked tmpfile gives the same anonymous, fd-only
# lifetime as a memfd. Never compiled for the Linux CVM.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tempfile = { version = "3", optional = true }
# The tmpfile has no seals to hold a mapping still, so there the admission check
# reads a copy instead, scrubbed on drop: it is plaintext (possible embedded model
# weights).
zeroize = { version = "1", optional = true }

[features]
# Enables the `execution-worker` bin. api does not depend on this crate at all —
# it drives the worker over rpc — so nothing here reaches the orchestrator, with
# or without this feature.
worker = [
    # The supervisor is the half that speaks to the host: it reports its
    # configuration at boot and says why it is stopping. The child does not, so
    # this rides the worker feature rather than the dependency.
    "safe-logger/device",
    "dep:engine-rpc",
    "dep:enclavid-boundary",
    "dep:enclavid-boundary-macros",
    "dep:engine-supervisor",
    "dep:remoc",
    "tokio/macros",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/io-util",
    # `process` — the supervisor spawns per-round `engine-executor-child` processes;
    # `sync` — the bounded-children `Semaphore`; `time` — the round deadlines.
    "tokio/process",
    "tokio/sync",
    "tokio/time",
    "dep:quick_cache",
    "dep:enclavid-ra-tls",
    "dep:fleet-transport",
    "dep:enclavid-attestation",
    "dep:tokio-rustls",
    # Platform-split cwasm backing (memfd on Linux, tmpfile in dev) — see the
    # target-specific dependency tables. `dep:` on a target-gated optional dep is
    # inert on the non-matching platform.
    "dep:memfd",
    "dep:rustix",
    "dep:tempfile",
    "dep:zeroize",
]
# The attestation backend, and it is a choice rather than an addition. Cargo
# features are additive, so `sev-snp` on top of the default would leave the
# software identity compiled in beside the real one — and that identity is a
# seed literal in this repository, which anyone can hold.
#
# `enclavid-attestation?/…` rather than `…/…`: the weak form turns the backend on
# only if something else already pulled the dependency in, which `worker` does.
# Written strongly, the default would drag the whole worker half — rpc, remoc,
# tokio — into a plain library build, which the `worker` comment above exists to
# prevent.
default = ["dev-attestation"]
dev-attestation = ["enclavid-attestation?/mock"]
# Real hardware attestation. Mints through `/dev/sev-guest` and carries NO
# endorsement, because this guest has no egress to fetch one — api supplies it
# from its own copy of the same chip's. See `SnpAttestor::mint_only`.
sev-snp = ["enclavid-attestation?/sev-snp"]
# The posture a measured guest image builds with: enforce the kernel ptrace floor
# the per-round child isolation rests on, and hold the round children to their
# memory with the kernel's memory controller, or refuse to boot.
# It pulls `sev-snp` in with it. A build that calls itself the measured posture
# while signing with the dev fleet's shared software key is the one mistake
# nothing else catches, because forgetting `--no-default-features` is silent —
# whereas asking for both backends at once is not, the binary's own guard refuses
# that. This turns the quiet mistake into the loud one, and costs no legitimate
# configuration: `guest-hardening` asserts a ptrace floor no ordinary kernel
# meets, so a build carrying it already refuses to run outside a measured image.
guest-hardening = ["worker", "sev-snp", "engine-supervisor/guest-hardening"]
# The attested build: reach api over vsock instead of TCP, and guard the clock.
vsock = ["worker", "fleet-transport/vsock", "dep:timesync"]
# Compiles the `debug!` sites in. OFF in the measured build, so a production
# binary holds no diagnostic that nobody wrote a reason for. The supervisor's
# half hands the per-round child this process's stderr.
debug = ["safe-logger/debug", "engine-supervisor?/debug"]

[[bin]]
name = "execution-worker"
required-features = ["worker"]

# Micro-bench isolating the `spawn` phase (exec + dyld + Engine::new + handshake)
# — the fork-zygote's only target. No fixtures/Cranelift, so it builds fast in a
# Linux container to answer the Stage-B gate.
[[bin]]
name = "spawn-bench"
required-features = ["worker"]

[dev-dependencies]
# happy_path.rs drives rounds in-process; the one that spawns the real child
# process moved out with the binary, and the tokio features it needed
# (process/net/io-util/time) went with it. `time`, `sync` and `test-util` are the
# worker's capacity tests: they wait on its semaphores under a paused clock.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "test-util"] }
# happy_path.rs is the end-to-end integration test: it COMPOSES a policy +
# plugins (engine-compiler), round-trips the cwasm onto this crate's engine,
# and drives full reducer rounds against real fixtures.
engine-compiler = { path = "../engine-compiler" }
# load_copies.rs builds a component carrying a large data segment, to see what
# loading its cwasm copies.
wasm-encoder = "0.247"
# The props tests, and the runner's test that the host serves every interface
# the compile counts as its own, build components from WIT alone.
wit-component = { version = "0.247", features = ["dummy-module"] }
wit-parser = "0.247"
# fake_capture emits a real JPEG so the face-age plugin's in-sandbox
# decode → preprocess → inference pipeline has something to decode.
jpeg-encoder = "0.6"
# The fixture catalog + the shared build→componentize→embed pipeline — the SAME
# code `xtask push-plugins` uses, so tested and shipped artifacts match.
xtask = { path = "../../xtask" }
