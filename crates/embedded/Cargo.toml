[package]
name = "enclavid-embedded"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared schema for the embedded-data sections (disclosure-fields + i18n) carried inside Enclavid policy and plugin wasm components"

[lib]
path = "src/lib.rs"

[features]
# Embedding a project's catalogs into a component: the CLI and other builders.
embed = ["dep:anyhow", "dep:wasm-encoder", "dep:wit-parser"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
anyhow = { version = "1", optional = true }
wasm-encoder = { version = "0.247", optional = true }
wit-parser = { version = "0.247", optional = true }

[dev-dependencies]
# The embed tests build a component of a world to embed into.
tempfile = "3"
wit-component = { version = "0.247", features = ["dummy-module"] }
