[package]
name = "host-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The blind byte pump on the host. Accepts on ONE unix socket and splices to ONE
# destination — no routing table, no topology awareness, no knowledge of protocols.
# "Which traffic goes where" is decided by which instances are started and with
# what arguments — never by config inside the process.
#
# This is also the ONLY crate in the workspace that knows a hypervisor exists.
# cloud-hypervisor's host-side vsock is not AF_VSOCK: it is a unix socket with
# the Firecracker "hybrid" protocol (`CONNECT <port>\n` / `OK <port>\n`). That
# handshake is the sole reason this binary must exist at all — general-purpose
# proxies can splice, but none can emit the preamble.
#
# Deps are tokio + clap only. Nothing from the TEE side: the relay is untrusted
# and must not be able to interpret a single byte it carries.

[dependencies]
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "time",
] }
clap = { version = "4.5", features = ["derive"] }

# AF_VSOCK exists only on Linux, and this binary only ever RUNS on Linux — but it
# must still build on a dev machine, so the dependency is target-conditional
# rather than feature-gated. The `vsock:` schemes parse everywhere and fail with
# `Unsupported` if actually used off-Linux.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
