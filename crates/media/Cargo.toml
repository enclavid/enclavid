[package]
name = "enclavid-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# What a round and the coprocess decoding its media say to each other. No
# decoder and no picture processing here, so the round's side links none.
[dependencies]
# The bounds a decode is held to.
engine-types = { path = "../engine-types" }
# The messages are serde values, which `coprocess-channel` carries; a capture's
# bytes and a region's pixels go as byte strings.
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

[dev-dependencies]
coprocess-channel = { path = "../coprocess-channel" }
