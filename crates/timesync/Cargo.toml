[package]
name = "timesync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The guest's clock, in two halves:
#
#   the keeper   the `timesync` binary, under `keeper`: NTS key exchanges and
#                time packets over vsock, a quorum of servers, the kernel clock
#                steered by the result. See src/main.rs.
#   the guard    the library, with no feature: what every role reads of the
#                clock the keeper keeps, and the guard that ends a role when
#                the kernel stops vouching for it. See src/lib.rs.
#
# A role depends on this crate for the guard alone, so everything the keeper
# needs is optional and comes with `keeper` — a role takes no NTS, no TLS of
# its own, no runtime from here.

[lib]
path = "src/lib.rs"

[[bin]]
name = "timesync"
path = "src/main.rs"
required-features = ["keeper"]

[features]
keeper = [
    "dep:ntp-proto",
    "dep:clock-steering",
    "dep:rustls",
    "dep:tokio",
    "dep:fleet-transport",
    "dep:tracing",
    "dep:caps",
    "dep:seccompiler",
]
# The attested build of the keeper: the servers are reached over vsock, through
# the host. Without it the keeper dials TCP on 127.0.0.1, which only a
# developer's box has.
vsock = ["keeper", "fleet-transport/vsock"]
# Compiles `debug!`, and lets the synchronisation algorithm's own records reach
# it: `ntp-proto` reports through `tracing`, which hands its records to `log`
# when nothing subscribes, and the debug logger prints those.
debug = ["safe-logger/debug", "tracing?/log"]

[dependencies]
# Outward: the guard says why it ends a role, and the keeper which server
# stopped answering — both things the host's operator is the one to know.
safe-logger = { path = "../safe-logger", features = ["device"] }
# `adjtimex` for the guard, and the system call numbers the keeper's filter
# names.
libc = "0.2"

# The protocol and the algorithm — NTS key exchange, time packets, source
# selection, the clock filter — without the daemon around them, whose sockets
# are IP and nothing else. `__internal-api` is how ntpd-rs's own daemon reaches
# the same types; the crate promises no stable interface, hence the exact pin.
# `rustcrypto` for the packet AEAD, leaving TLS on the provider below.
ntp-proto = { version = "=1.9.0", optional = true, default-features = false, features = [
    "rustcrypto",
    "__internal-api",
] }
# What the algorithm's decisions become: `clock_adjtime` on CLOCK_REALTIME. The
# same crate and version ntp-proto 1.9 is built against.
clock-steering = { version = "=0.2.1", optional = true }
# TLS for the key exchange, on `ring` like every other TLS in the workspace.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
tokio = { version = "1", optional = true, features = ["rt", "macros", "time", "sync", "io-util"] }
# The dial: vsock in the measured build, TCP on a developer's box.
fleet-transport = { path = "../fleet-transport", optional = true }
# Only for the `log` feature `debug` turns on; ntp-proto already depends on it.
tracing = { version = "0.1", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The keeper's lock (src/lock.rs): capabilities narrowed to CAP_SYS_TIME, then a
# syscall allowlist — the same `seccompiler` engine-supervisor builds its
# children's filters with. Pure Rust both; no libcap or libseccomp underneath.
caps = { version = "0.5", optional = true }
seccompiler = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
