[package]
name = "enclavid-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Symmetric AEAD for session-blob sealing. ChaCha20-Poly1305: constant-
# time without AES-NI assumptions, small dep tree.
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# Anonymous public-key sealing to the consumer's X25519 key. libsodium's
# `crypto_box_seal` wire format, so a consumer decrypts with the libsodium
# binding their language already has — no format-specific library, and no
# CLI-shaped baggage (the `age` crate carried Fluent localisation and
# passphrase support into the measured image for neither's benefit).
crypto_box = { version = "0.9", features = ["seal"] }

# ocicrypt layer cipher (AES-256-CTR + HMAC-SHA256, the ocicrypt
# `AES_256_CTR_HMAC_SHA256` scheme). In-house, byte-exact to the ocicrypt
# LayerBlockCipherOptions format so artifacts interop with standard
# ocicrypt tooling (skopeo / coco-keyprovider). See [`crate::ocicrypt`].
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
base64ct = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# Zeroize the ocicrypt per-artifact `symmetric_key` (live KBS-released layer key)
# on drop. It's a serde-serialized field, so it can't be a `SecretBox` — a manual
# `Drop` + redacting `Debug` on `PrivateLayerBlockCipherOptions` instead.
zeroize = "1"
