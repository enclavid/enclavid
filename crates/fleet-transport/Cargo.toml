[package]
name = "fleet-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The byte stream the intra-fleet legs run RA-TLS over — one place for the
# TCP/vsock split so the four participants do not each grow their own copy.
[dependencies]
tokio = { version = "1", features = ["net"] }

# Linux-only: AF_VSOCK exists in no other kernel. Optional on top of that, so a
# dev build carries no vsock code at all.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { version = "0.7", optional = true }

[features]
# The attested build. A measured guest kernel is built without CONFIG_INET, so
# TCP cannot work there; a developer's box has no vsock peers, so it uses TCP.
# Which arm a binary carries is a build-time fact about where it runs.
vsock = ["dep:tokio-vsock"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
