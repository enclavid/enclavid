[package]
name = "public-logger"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Everything written here is read by the host. See src/lib.rs — the shape is the
# point, not the code.

# OFF in the measured build, so `debug!` is not compiled and its strings are not
# in the binary. Off by default rather than on-and-disabled: forgetting it costs
# a developer their local output, which they notice at once, where the inverse
# would quietly carry dead diagnostics into a production image.
[features]
debug = []

[dependencies]
# Same `Exposed` / `Covert` / `reason!` the wire perimeter uses: one discipline
# for every byte leaving the TEE, whichever way it leaves.
enclavid-boundary = { path = "../boundary" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
