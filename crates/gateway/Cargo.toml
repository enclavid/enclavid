[package]
name = "enclavid-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The measured role that terminates client TLS. It is the component that makes
# "TLS-in-TEE for inbound" true rather than aspirational: api's serving
# listeners present a certificate no browser can trust — plain HTTP in a
# developer build, RA-TLS in the attested one — so a browser's session for a
# public name either ends on the host, ending the guarantee, or ends here.
#
# It cannot live on the host, because it holds the private key for a public name
# AND serves the page. Either alone might be arguable; together they would let a
# host-side process present whatever it liked about the enclave behind it.

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
# The guest's one channel to the host: `info!`/`warn!`/`error!` carry a written
# reason and reach the port; `debug!` needs none and is not built in production.
safe-logger = { path = "../safe-logger", features = ["device"] }
# The intra-fleet byte stream and the health port. All three listeners this
# role owns — public, configuration, health — come from here, so the accept
# loop and its error policy are the fleet's rather than a copy of this role's.
#
# `tower-adapter` for `service::serve`: the public listener and the
# configuration port are each a service asked for room before the next
# connection is taken, so a full one leaves the rest in the kernel's backlog —
# see `crate::listener` and `crate::config::push`.
fleet-transport = { path = "../fleet-transport", features = ["tower-adapter"] }
tokio = { version = "1", features = ["full"] }

# Three things: the HTTP/1.1 server on the configuration port the host pushes
# to (`crate::config::push`), the public listener's servers under `hyper-util`'s
# (`crate::listener`), and the HTTP/2 client that carries requests to api over
# an already-attested stream (`crate::upstream::member`). The last is why
# `client` is here rather than only in the tests.
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
# `server-auto` is what lets one accepted connection be either h2 or http/1.1:
# the handshake offers both, the caller speaks whichever it agreed to, and the
# builder tells them apart by the first bytes rather than asking the TLS layer.
#
# `service`, because each request gets its response from a tower stack — its
# body's bounds are layers — and the HTTP library is handed that stack through
# `TowerToHyperService`.
hyper-util = { version = "0.1", features = [
    "tokio",
    "server",
    "server-auto",
    "http1",
    "http2",
    "service",
] }
# Which member of a group takes a request, how much it is asked to start at
# once, and how many public connections are served — see `crate::listener`.
#
# The algorithm only: `p2c` chooses among the members that are ready, and
# `ConcurrencyLimit` holds a slot until api's response head is back. What tower
# does NOT have is a connection pool — `balance::pool` existed in 0.4 and is
# gone from 0.5 — so the legs to one member are `crate::upstream::member`'s
# own, which is also what keeps the count of connections to api tied to
# requests in flight rather than to callers. The deadline on a response is the
# member's own too, since it starts only once the request body is sent.
tower = { version = "0.5", default-features = false, features = [
    "balance",
    "limit",
    "util",
] }
# The `Stream` trait, and only the trait. Membership reaches the balancer as a
# stream of changes and there is no trait of tower's own to implement for it —
# it is spelled as a stream — so `crate::upstream::balance` writes one over a
# channel.
# This crate is trait definitions and nothing else, which is the whole of what a
# measured image takes on for it.
futures-core = { version = "0.3", default-features = false }
# Bodies: the boxed ones both legs carry, the size cap on a push, the frame map
# that takes a request's trailers off, and the fixed bodies this role writes.
http-body-util = "0.1"
# The layers a request's body passes through on its way in — see
# `crate::listener::body`: the longest pause between frames, and the mapping
# that puts this role's own deadline on the whole body, which the pause alone
# cannot be, since a caller sending a byte just inside every pause would never
# trip it. Already in the lock through api.
#
# `catch-panic` gives a request whose handling panicked the response of one
# that failed behind this role, rather than resetting its stream — or, on
# HTTP/1, the whole connection. What it pulls in, `tracing` and `futures-util`,
# is already here under h2 and tower.
tower-http = { version = "0.6", default-features = false, features = [
    "timeout",
    "map-request-body",
    "catch-panic",
] }
bytes = "1"
# `ring` rather than aws-lc, pinned the same way `crates/ra-tls` pins it and for
# the same reason: both compile C and assembly, but aws-lc is a whole libcrypto
# where ring is the few primitives TLS needs — far less C in a build whose
# output is a published digest.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
# The serving key is derived from what the chip gives this guest, so that it is
# the same key at every boot — see `crate::identity::key`. HKDF from `crypto`,
# and P-256 because that is the curve an authority will issue a certificate for.
enclavid-crypto = { path = "../crypto" }
p256 = { version = "0.13", features = ["pkcs8"] }
# Wipes the copies of the serving key made on the way to it — the chip's key,
# the derived scalar, the PKCS#8 bytes — see `crate::identity::key`. Already in
# the image under the crypto crates.
zeroize = "1"

# Mints the serving certificate over the pushed names, and the request an
# issuer finalises against. Already in the lock through ra-tls, though for a different kind of
# certificate — see `crate::identity::tls`.
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
# What an issued certificate is checked with before it is presented: whether it
# answers for a name as a client would judge it, and its validity window. Both
# already in the image — the first under rustls, the second under ra-tls.
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
x509-parser = "0.16"
# The leg to api. This role pins no api build: it verifies each upstream's quote
# and proves it carries the measurement the caller named — see `crate::upstream`.
# Also the evidence this role serves about itself, made by the same call that
# fills an RA-TLS certificate's extension — see `crate::identity::attest`.
enclavid-ra-tls = { path = "../ra-tls" }
enclavid-attestation = { path = "../attestation", default-features = false }
# The configuration the host pushes. JSON so a push needs nothing but a file on
# the host; decoded straight into typed structs, so the structs are the grammar.
# Both already in the measured api image.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Matches the paths a push's rules name — see `crate::route::Rules`. The router
# api's own is built on, so a rule written as api writes its route matches the
# requests api's route does, and two rules a request could not choose between
# are refused at the push. No dependencies of its own; already in the measured
# api image.
matchit = "0.8"
# The keyed hash a source is counted under (`crate::listener::source`), the
# random choice of a group, and a certificate's serial — from the library this
# role's TLS already runs on, so none adds cryptography to the image. The
# features are the ones the TLS stack already turns on.
ring = "0.17"
# Two system calls and four error numbers: raising the descriptor limit at boot
# (see `reserve_descriptors` in `main.rs`), and telling a dial that failed for
# want of descriptors HERE from one the member failed (`crate::upstream::member`).
# Already in the image under tokio.
libc = "0.2"
# Parses the PROXY protocol v2 header the host's first hop writes ahead of each
# public connection — see `crate::listener::source`. The most used and most
# tested implementation, taken whole: it has no features to trim, and its text
# version is never called here. Its one dependency, `thiserror` 1, is already
# in the image through the attestation crates.
ppp = "2"

[dev-dependencies]
# A test issuer's certificates written as PEM, the form a push carries them in.
# The feature is on in the image already through ra-tls; named here so the
# tests do not lean on that.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# A request body a test feeds by hand, to hold it open or trickle it — see
# `crate::listener::body`. A test build's feature only.
http-body-util = { version = "0.1", features = ["channel"] }

[features]
# Default: TCP, and a plain HTTP leg to api. That is a developer box, where
# there is no host between the two processes to protect anything from.
#
# The attestation backend is a second, independent axis. Cargo features are
# additive — asking for `sev-snp` on top of the default would leave the software
# test identity compiled into the measured image beside the real one — so the
# dev backend is the DEFAULT rather than unconditional, and the attested build
# turns it off:
#   cargo build -p enclavid-gateway --no-default-features --features sev-snp,vsock
default = ["dev-attestation"]
# A measured guest kernel has no IP stack, so vsock is not a preference. It is
# also the axis that decides whether the leg to api is RA-TLS, mirroring the
# same choice on api's inbound.
vsock = ["fleet-transport/vsock"]
# The ONE shared identity a dev fleet needs: a software attestor verifies
# against its own key, so peers that each generated their own could never attest
# each other.
dev-attestation = ["enclavid-attestation/mock"]
# Real hardware attestation. Mints through `/dev/sev-guest` and carries NO
# endorsement, because this guest has no egress to fetch one: whoever checks this
# role's quote fetches the certificate for the chip it names. Verifying api needs
# none of its own, because api's quote carries its chain. See
# `SnpAttestor::mint_only_across_parts`.
sev-snp = ["enclavid-attestation/sev-snp"]
# Compiles the `debug!` sites in. OFF in the measured build, so a production
# binary holds no diagnostic that nobody wrote a reason for.
debug = ["safe-logger/debug"]
