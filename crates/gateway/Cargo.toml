[package]
name = "enclavid-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The measured role that terminates client TLS. It is the component that makes
# "TLS-in-TEE for inbound" true rather than aspirational: api's serving
# listeners speak plain HTTP, so whatever carries TLS to the host today either
# terminates it — ending the guarantee — or splices it into a listener that
# cannot speak it.
#
# It cannot live on the host, because it holds the private key for a public name
# AND serves the page. Either alone might be arguable; together they would let a
# host-side process present whatever it liked about the enclave behind it.

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
# The guest's one channel to the host: `info!`/`warn!`/`error!` carry a written
# reason and reach the port; `debug!` needs none and is not built in production.
safe-logger = { path = "../safe-logger", features = ["device"] }
# The intra-fleet byte stream and the health port. Both listeners this role owns
# come from here, so the accept loop and its error policy are the fleet's rather
# than a fifth copy.
fleet-transport = { path = "../fleet-transport" }
tokio = { version = "1", features = ["full"] }

# The HTTP machinery: the public server, the connections to api, and the
# placement and retry behaviour around them. Built WITHOUT a TLS backend,
# because both handshakes are this role's own — the public one terminates on a
# key this guest minted, and the one to api proves a measurement the caller
# named, which no general TLS stack can check. See `crate::leg` for how an
# already-attested connection reaches it.
pingora-core = { version = "0.9", default-features = false }
pingora-proxy = { version = "0.9", default-features = false }
pingora-http = "0.9"
# Buffer sizes on the socket pair that carries a leg — see `crate::leg`.
libc = "0.2"
# pingora's connector trait is async, and this is how it spells that.
async-trait = "0.1"

# The public server, and the HTTP/2 client connections to api. `auto` is what
# dispatches h2 against http/1.1 per public connection. The client is hyper's
# own per-connection one rather than hyper-util's pooled `Client`: a connection
# to api belongs to one public connection and is never pooled — see
# `crate::upstream`.
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server",
    "server-auto",
    "http1",
    "http2",
] }
# One fixed response body, and the `Bytes` it is built from.
http-body-util = "0.1"
bytes = "1"
# `ring` rather than aws-lc, pinned the same way `crates/ra-tls` pins it and for
# the same reason: aws-lc-sys wants cmake and a C toolchain in a build whose
# output is a published digest.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
# The serving key is derived from what the chip gives this guest, so that it is
# the same key at every boot — see `crate::key`. HKDF from `crypto`, and P-256
# because that is the curve an authority will issue a certificate for.
enclavid-crypto = { path = "../crypto" }
p256 = { version = "0.13", features = ["pkcs8"] }

# Mints the serving certificate at boot. Already in the lock through ra-tls,
# though for a different kind of certificate — see `crate::tls`.
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
# The leg to api. This role pins no api build: it verifies each upstream's quote
# and proves it carries the measurement the caller named — see `crate::upstream`.
enclavid-ra-tls = { path = "../ra-tls" }
enclavid-attestation = { path = "../attestation", default-features = false }
# The configuration the host pushes. JSON so a push needs nothing but a file on
# the host; decoded straight into typed structs, so the structs are the grammar.
# Both already in the measured api image.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The affinity key arrives written as hex. Already in the measured api image,
# and this is the decoder the rest of the workspace reads digests with.
hex = { version = "0.4", features = ["serde"] }
# The quote this role serves about itself, in the same encoding an RA-TLS
# certificate carries it in, so one verifier reads both — see `crate::attest`.
ciborium = "0.2"
# The affinity token: an HS256 JWT assembled by hand from these three, rather
# than a JWT library, which would add a parser, PEM and ASN.1 to a measured
# image to check thirty-two bytes of HMAC — see `crate::affinity`.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[features]
# Default: TCP, and a plain HTTP leg to api. That is a developer box, where
# there is no host between the two processes to protect anything from.
#
# The attestation backend is a second, independent axis. Cargo features are
# additive — asking for `sev-snp` on top of the default would leave the software
# test identity compiled into the measured image beside the real one — so the
# dev backend is the DEFAULT rather than unconditional, and the attested build
# turns it off:
#   cargo build -p enclavid-gateway --no-default-features --features sev-snp,vsock
default = ["dev-attestation"]
# A measured guest kernel has no IP stack, so vsock is not a preference. It is
# also the axis that decides whether the leg to api is RA-TLS, mirroring the
# same choice on api's inbound.
vsock = ["fleet-transport/vsock"]
# The ONE shared identity a dev fleet needs: a software attestor verifies
# against its own key, so peers that each generated their own could never attest
# each other.
dev-attestation = ["enclavid-attestation/mock"]
# Real hardware attestation. Mints through `/dev/sev-guest` and carries NO
# endorsement, because this guest has no egress to fetch one — api supplies it
# from its own copy of the same chip's. See `SnpAttestor::mint_only`.
sev-snp = ["enclavid-attestation/sev-snp"]
# Compiles the `debug!` sites in. OFF in the measured build, so a production
# binary holds no diagnostic that nobody wrote a reason for.
debug = ["safe-logger/debug"]
