[package]
name = "engine-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The COMPILE half of the engine fleet: fuse a policy + its pinned plugins
# into one component and run Cranelift codegen, producing serializable
# `cwasm`. This is the ONLY crate carrying the Cranelift toolchain — the
# execution half (engine-executor) structurally does not depend on it, so
# the CVM that runs untrusted wasm carries no compiler surface. Shares only
# the plain-data engine-types leaf with the executor; the compiled cwasm
# bytes are the sole artifact crossing between them.
[dependencies]
# The guest's one channel to the host: `info!`/`warn!`/`error!` carry a written
# reason and reach the port; `debug!` needs none and is not built in production.
#
# WITHOUT the `device` feature here — the worker adds it below. The library uses
# none of this crate; only the worker bin does. Leaving it off means the child
# package, which depends on this library and is built by its own cargo
# invocation, gets no outward half through this edge either.
safe-logger = { path = "../safe-logger" }
engine-types = { path = "../engine-types" }

# Cranelift codegen + component fusion validation. Same feature set as the
# executor's wasmtime so the `Config` (and hence the cwasm compatibility
# header) matches bit-for-bit — a component serialized here must deserialize
# on the executor's runtime-only engine.
wasmtime = { version = "46", default-features = false, features = [
    "cranelift",
    "component-model",
    "runtime",
    "std",
    "async",
] }

# Single-store fusion: `compose::fuse` wires each plugin's exports into the
# policy's imports via wac's hand-built composition graph. wac 0.10 emits
# wasm-tools 0.247 encoding, which wasmtime 46 loads.
wac-graph = "0.10"

# `decls::load_embedded` pulls the embedded custom sections (disclosure-
# fields / i18n / icons) straight out of a compiled component without
# round-tripping through wasmtime instantiation.
wasmparser = "0.247"

# Catalog content-hashing (`hash::catalog_hash`) + the section parsers /
# cardinality caps the loader enforces.
blake3 = "1"
enclavid-embedded = { path = "../embedded" }

# --- compile-worker bin deps (optional) — pulled ONLY by the `worker`
# feature or by `child-seam`, so a lib built with NEITHER stays rpc/remoc-free. The worker BIN is the deployable
# compile-worker CVM: it serves `engine_rpc::CompilerService` and forwards each
# compile to a disposable child — this crate's `Compiler` runs in that CHILD
# (engine-compiler-child), not here. api does not depend on this crate at all; it
# drives the worker over rpc. ---
engine-rpc = { path = "../engine-rpc", default-features = false, features = ["compile"], optional = true }
enclavid-boundary = { path = "../boundary", optional = true }
# Shared disposable-child process-isolation plumbing (spawn + concurrency bound +
# compile deadline + reap); the execution-worker rides the same crate. The
# compile-worker is its SIMPLER consumer — no cache, no callbacks.
engine-supervisor = { path = "../engine-supervisor", optional = true }
remoc = { version = "0.18", default-features = false, features = [
    "rtc",
    "codec-ciborium",
], optional = true }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
], optional = true }
# Mutual RA-TLS on the api->worker hop (same as the execution-worker): the compile
# listener wraps each accepted TCP stream in an attested TLS server. Dev-bypass = the
# mock backend; the prod flip is this crate's own `sev-snp`, off the defaults
# (`enclavid-ra-tls` names no backend and has no features to flip).
enclavid-ra-tls = { path = "../ra-tls", optional = true }
fleet-transport = { path = "../fleet-transport", optional = true }
# The RA-TLS backend is chosen here, not by ra-tls — see the `[features]` axis.
# The hardware arm exists now. This worker still has no path to AMD, which is
# what shapes it rather than what prevents it: it mints without an endorsement
# and api, which can reach AMD, verifies against its own copy of the same chip's.
enclavid-attestation = { path = "../attestation", default-features = false, optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }

[features]
# Enables the `compile-worker` (supervisor) bin. Only the worker build pulls
# tokio/harness and the attestation stack. `child-seam` is the smaller half of
# that — rpc + remoc only — and the child takes it, so the child is no longer a
# consumer of the rpc-free lib. What stays free of everything is a lib built with
# neither feature: tests and engine-executor's dev-deps.
worker = [
    # The supervisor is the half that speaks to the host: it reports its
    # configuration at boot and says why it is stopping. The child does not, so
    # this rides the worker feature rather than the dependency.
    "safe-logger/device",
    # The supervisor drives the child over the seam, so it needs the client the
    # seam's trait generates.
    "child-seam",
    # The supervisor names its own scope on what api sends it, so it reaches the
    # vocabulary directly rather than through whoever happens to re-export it.
    "dep:enclavid-boundary",
    "dep:engine-supervisor",
    "dep:tokio",
    "dep:enclavid-ra-tls",
    "dep:enclavid-attestation",
    "dep:tokio-rustls",
    "dep:fleet-transport",
]
# This role's supervisor↔child hop (`crate::seam`). Its own feature rather than
# part of `worker`, because BOTH halves need it — the supervisor to drive the
# child, the child to serve — and the child is a separate package that takes the
# pure library. It is the whole of what either half needs from `engine-rpc`, which
# is why the dependency rides here.
child-seam = ["dep:engine-rpc", "dep:remoc"]

# The attestation backend, and it is a choice rather than an addition. Cargo
# features are additive, so `sev-snp` on top of the default would leave the
# software identity compiled in beside the real one — and that identity is a
# seed literal in this repository, which anyone can hold.
#
# `enclavid-attestation?/…` rather than `…/…`: the weak form turns the backend on
# only if something else already pulled the dependency in, which `worker` does.
# Written strongly, the default would drag the whole worker half — rpc, remoc,
# tokio — into a plain library build, which the `worker` comment above exists to
# prevent.
default = ["dev-attestation"]
dev-attestation = ["enclavid-attestation?/mock"]
# Real hardware attestation. Mints through `/dev/sev-guest` and carries NO
# endorsement, because this guest has no egress to fetch one — api supplies it
# from its own copy of the same chip's. See `SnpAttestor::mint_only`.
sev-snp = ["enclavid-attestation?/sev-snp"]
# The posture a measured guest image builds with: enforce the kernel ptrace floor
# the per-round child isolation rests on.
# It pulls `sev-snp` in with it. A build that calls itself the measured posture
# while signing with the dev fleet's shared software key is the one mistake
# nothing else catches, because forgetting `--no-default-features` is silent —
# whereas asking for both backends at once is not, the binary's own guard refuses
# that. This turns the quiet mistake into the loud one, and costs no legitimate
# configuration: `guest-hardening` asserts a ptrace floor no ordinary kernel
# meets, so a build carrying it already refuses to run outside a measured image.
guest-hardening = ["worker", "sev-snp", "engine-supervisor/guest-hardening"]
# The attested build: reach api over vsock instead of TCP.
vsock = ["worker", "fleet-transport/vsock"]
# Compiles the `debug!` sites in. OFF in the measured build, so a production
# binary holds no diagnostic that nobody wrote a reason for.
debug = ["safe-logger/debug"]

[[bin]]
name = "compile-worker"
required-features = ["worker"]

[dev-dependencies]
# embedded_nested.rs builds synthetic (nested) components to exercise
# load_embedded_nested's recursion without cargo-building fixtures.
wasm-encoder = "0.247"
