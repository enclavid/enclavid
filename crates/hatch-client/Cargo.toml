[package]
name = "hatch-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The contract with the hatch-CVM, whose remoc client the typed clients here
# call through.
hatch-rpc = { path = "../hatch-rpc" }
# A blob's stream beside its reply, read a piece at a time.
fleet-stream = { path = "../fleet-stream" }
futures = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
# The concern vocabulary the `boundary` facades are built from. A leaf crate
# because `safe-logger` needs the same words for the serial-port crossing and
# must not pull a wire client in to get them.
enclavid-boundary = { path = "../boundary" }
# `time` for the one deadline every hatch call runs under: a remoc call has none
# of its own.
tokio = { version = "1", features = ["time"] }
